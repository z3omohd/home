<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاريع z3omohd | Launchpad</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 29, 47, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.2);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --glass-glow: rgba(99, 102, 241, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 120px;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* Controls Bar */
    .controls-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #6366f1;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    /* App Grid */
    .app-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* App Card / Link Container */
    .app-card-wrapper {
      position: relative;
      text-decoration: none;
      display: block;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .app-card-wrapper:hover .app-card,
    .app-card-wrapper:active .app-card {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 20px var(--glass-glow);
    }

    .app-card-wrapper:hover .app-card::before {
      opacity: 1;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s ease;
    }

    .app-card-wrapper:hover .icon-box {
      transform: scale(1.08);
    }

    .icon-box i {
      width: 26px;
      height: 26px;
      color: #ffffff;
    }

    .app-title {
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
      font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
    }

    .app-id {
      color: var(--text-sub);
      font-size: 11px;
      font-family: 'Plus Jakarta Sans', monospace;
      opacity: 0.7;
    }

    /* GitHub Repo Link Badge */
    .github-link {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      text-decoration: none;
      z-index: 2;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .github-link:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: scale(1.1);
    }

    .github-link i {
      width: 14px;
      height: 14px;
    }

    /* Floating Add Button */
    .fab-add {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      cursor: pointer;
      z-index: 10;
      transition: all 0.25s ease;
    }

    .fab-add:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .color-pickers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .color-picker {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }

    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 8px; }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-submit {
      flex: 1;
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-submit:hover { background: #4f46e5; }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="avatar-wrapper">
      <div class="avatar-img">👨‍💻</div>
    </div>
    <h1 class="header-title">مشاريع <span>z3omohd</span></h1>
    <p class="header-sub">بوابة الوصول السريع لجميع التطبيقات والمشاريع</p>
  </header>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="بحث سريع في المشاريع...">
    </div>
  </div>

  <!-- App Grid -->
  <div class="app-grid" id="appGrid">
    <!-- Grid items rendered dynamically -->
  </div>

  <!-- Floating Add Button -->
  <button class="fab-add" onclick="openModal()">
    <i data-lucide="plus"></i>
    إضافة مشروع جديد
  </button>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">
          <i data-lucide="sparkles" style="color: #6366f1;"></i>
          إضافة مشروع جديد
        </h3>
        <button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button>
      </div>

      <form id="addProjectForm" onsubmit="handleSaveProject(event)">
        <div class="form-group">
          <label class="form-label">اسم المستودع (ID)</label>
          <input type="text" id="repoId" class="form-input" placeholder="مثال: my-new-app" required oninput="autoFillTitle(this.value)">
        </div>

        <div class="form-group">
          <label class="form-label">العنوان المعروض</label>
          <input type="text" id="displayTitle" class="form-input" placeholder="مثال: My New App" required>
        </div>

        <div class="form-group">
          <label class="form-label">الأيقونة (Lucide Icon Name)</label>
          <input type="text" id="iconName" class="form-input" value="layers" placeholder="layers, shield, wallet, activity...">
        </div>

        <div class="form-group">
          <label class="form-label">تدرج الألوان</label>
          <div class="color-pickers">
            <div class="color-input-wrapper">
              <input type="color" id="color1" class="color-picker" value="#3b82f6">
              <span style="font-size: 12px; color: var(--text-sub);">اللون الأول</span>
            </div>
            <div class="color-input-wrapper">
              <input type="color" id="color2" class="color-picker" value="#8b5cf6">
              <span style="font-size: 12px; color: var(--text-sub);">اللون الثاني</span>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-submit">حفظ المشروع</button>
          <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const USERNAME = 'z3omohd';

    // Default Initial Repositories
    const defaultApps = [
      { id: 'Faris', title: 'Faris', icon: 'shield-check', colors: ['#ec4899', '#8b5cf6'] },
      { id: 'talk', title: 'Talk', icon: 'message-square', colors: ['#3b82f6', '#1d4ed8'] },
      { id: 'spend', title: 'Spend', icon: 'wallet', colors: ['#f59e0b', '#d97706'] },
      { id: 'salary', title: 'Salary', icon: 'badge-dollar-sign', colors: ['#10b981', '#059669'] },
      { id: 'convert', title: 'Convert', icon: 'refresh-cw', colors: ['#06b6d4', '#3b82f6'] },
      { id: 'life-tracker', title: 'Life Tracker', icon: 'activity', colors: ['#ef4444', '#f43f5e'] },
      { id: 'sun', title: 'Sun', icon: 'sun', colors: ['#eab308', '#f97316'] },
      { id: 'salary-data', title: 'Salary Data', icon: 'database', colors: ['#10b981', '#047857'] },
      { id: 'events', title: 'Events', icon: 'party-popper', colors: ['#f43f5e', '#a855f7'] },
      { id: 'cm', title: 'CM', icon: 'briefcase', colors: ['#6366f1', '#4f46e5'] },
      { id: 'fav', title: 'Fav', icon: 'bookmark', colors: ['#ec4899', '#f43f5e'] },
      { id: 'period', title: 'Period', icon: 'hourglass', colors: ['#a855f7', '#7c3aed'] },
      { id: 'control', title: 'Control', icon: 'sliders', colors: ['#64748b', '#334155'] },
      { id: 'timer', title: 'Timer', icon: 'timer', colors: ['#0284c7', '#2563eb'] }
    ];

    let projects = JSON.parse(localStorage.getItem('z3omohd_projects')) || defaultApps;

    function renderApps(filterText = '') {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';

      const filtered = projects.filter(p => 
        p.title.toLowerCase().includes(filterText.toLowerCase()) || 
        p.id.toLowerCase().includes(filterText.toLowerCase())
      );

      filtered.forEach(app => {
        const pageUrl = `https://${USERNAME}.github.io/${app.id}/`;
        const repoUrl = `https://github.com/${USERNAME}/${app.id}`;

        const cardWrapper = document.createElement('div');
        cardWrapper.className = 'app-card-wrapper';

        cardWrapper.innerHTML = `
          <a href="${repoUrl}" target="_blank" class="github-link" title="المستودع على GitHub" onclick="event.stopPropagation();">
            <i data-lucide="github"></i>
          </a>
          <a href="${pageUrl}" target="_blank" style="text-decoration: none; color: inherit;">
            <div class="app-card">
              <div class="icon-box" style="background: linear-gradient(135deg, ${app.colors[0]}, ${app.colors[1]});">
                <i data-lucide="${app.icon || 'layers'}"></i>
              </div>
              <div class="app-title">${app.title}</div>
              <div class="app-id">${app.id}</div>
            </div>
          </a>
        `;

        grid.appendChild(cardWrapper);
      });

      lucide.createIcons();
    }

    // Modal controls
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.getElementById('addProjectForm').reset();
    }

    function autoFillTitle(val) {
      if(val) {
        document.getElementById('displayTitle').value = val.charAt(0).toUpperCase() + val.slice(1);
      }
    }

    function handleSaveProject(e) {
      e.preventDefault();
      const id = document.getElementById('repoId').value.trim();
      const title = document.getElementById('displayTitle').value.trim();
      const icon = document.getElementById('iconName').value.trim() || 'layers';
      const c1 = document.getElementById('color1').value;
      const c2 = document.getElementById('color2').value;

      if (!id || !title) return;

      const newProject = {
        id: id,
        title: title,
        icon: icon,
        colors: [c1, c2]
      };

      projects.unshift(newProject);
      localStorage.setItem('z3omohd_projects', JSON.stringify(projects));
      
      renderApps();
      closeModal();
    }

    // Search event
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderApps(e.target.value);
    });

    // Initial Render
    renderApps();
  </script>
</body>
</html>
