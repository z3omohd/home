<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المشاريع | z3omohd</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Readex Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Readex Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Readex Pro', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ambient Dynamic Background Colors */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: float 16s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; right: -10%; width: 45vw; height: 45vw; background: #818cf8; }
        .blob-2 { bottom: -10%; left: -10%; width: 45vw; height: 45vw; background: #38bdf8; }
        .blob-3 { top: 35%; left: 35%; width: 30vw; height: 30vw; background: #f472b6; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(3%, 8%) scale(1.05); }
            100% { transform: translate(-3%, -3%) scale(0.95); }
        }

        /* Glassmorphism Effect for Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px -5px rgba(56, 189, 248, 0.25);
            background: rgba(255, 255, 255, 0.9);
        }
        .dark .glass-btn:hover {
            box-shadow: 0 12px 25px -5px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.85);
        }

        /* Glass Header */
        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-header {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Background Ambient Colors -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Header & Search Bar -->
    <header class="sticky top-0 z-50 glass-header py-4 px-4 sm:px-8 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- User Info / Logo -->
            <div class="flex items-center gap-3">
                <img src="https://github.com/z3omohd.png" onerror="this.src='https://placehold.co/100/3b82f6/fff?text=Z3'" alt="z3omohd" class="w-10 h-10 rounded-full ring-2 ring-sky-400/60 object-cover shadow-sm">
                <div>
                    <h1 class="font-bold text-base leading-tight">مشاريع z3omohd</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400">بوابة الوصول السريع</p>
                </div>
            </div>

            <!-- Compact Search Bar & Theme Switcher -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative w-full sm:w-72">
                    <i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="بحث سريع..." class="w-full pr-10 pl-4 py-2 text-xs bg-white/80 dark:bg-slate-800/80 backdrop-blur border border-slate-200 dark:border-slate-700/80 rounded-full focus:outline-none focus:ring-2 focus:ring-sky-500/50 transition-all text-slate-800 dark:text-slate-100 placeholder-slate-400">
                </div>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle" class="p-2.5 rounded-full bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 text-slate-700 dark:text-slate-200 hover:scale-105 transition-all shadow-sm shrink-0" title="تغيير المظهر">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-indigo-600"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-8 py-8 flex flex-col justify-center">
        
        <!-- Repositories Compact Grid -->
        <div id="buttons-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
            <!-- Dynamic Buttons Generated Here -->
        </div>

        <!-- Empty State Search Result -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
            <i data-lucide="search-x" class="w-10 h-10 text-slate-400 mb-2"></i>
            <p class="text-xs text-slate-500 dark:text-slate-400">لا يوجد مشروع بهذا الاسم</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-[11px] text-slate-400 dark:text-slate-500">
        z3omohd • GitHub Pages Portal
    </footer>

    <!-- Logic Script -->
    <script>
        // List of all 18 repositories with matching vibrant icons and gradients
        const projects = [
            { id: 'talk', name: 'Talk', icon: 'message-square', color: 'from-blue-500 to-indigo-500' },
            { id: 'Faris', name: 'Faris', icon: 'shield-check', color: 'from-purple-500 to-pink-500' },
            { id: 'salary', name: 'Salary', icon: 'badge-dollar-sign', color: 'from-emerald-500 to-teal-500' },
            { id: 'spend', name: 'Spend', icon: 'wallet', color: 'from-amber-500 to-orange-500' },
            { id: 'life-tracker', name: 'Life Tracker', icon: 'activity', color: 'from-rose-500 to-red-500' },
            { id: 'convert', name: 'Convert', icon: 'refresh-cw', color: 'from-cyan-500 to-blue-500' },
            { id: 'salary-data', name: 'Salary Data', icon: 'database', color: 'from-emerald-600 to-green-600' },
            { id: 'sun', name: 'Sun', icon: 'sun', color: 'from-amber-400 to-yellow-500' },
            { id: 'cm', name: 'CM', icon: 'briefcase', color: 'from-indigo-500 to-purple-600' },
            { id: 'events', name: 'Events', icon: 'party-popper', color: 'from-pink-500 to-rose-500' },
            { id: 'period', name: 'Period', icon: 'hourglass', color: 'from-violet-500 to-purple-500' },
            { id: 'fav', name: 'Fav', icon: 'bookmark', color: 'from-red-400 to-pink-500' },
            { id: 'timer', name: 'Timer', icon: 'timer', color: 'from-sky-500 to-indigo-500' },
            { id: 'control', name: 'Control', icon: 'sliders', color: 'from-slate-600 to-slate-800' },
            { id: 'term', name: 'Term', icon: 'terminal', color: 'from-teal-500 to-emerald-600' },
            { id: 'sport', name: 'Sport', icon: 'dumbbell', color: 'from-orange-500 to-amber-600' },
            { id: 'calend', name: 'Calend', icon: 'calendar', color: 'from-blue-600 to-indigo-600' },
            { id: 'it', name: 'IT', icon: 'cpu', color: 'from-cyan-600 to-teal-700' }
        ];

        // Dark / Light Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Render Buttons
        function renderButtons(filter = '') {
            const grid = document.getElementById('buttons-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const filteredProjects = projects.filter(p => p.id.toLowerCase().includes(filter.toLowerCase()) || p.name.toLowerCase().includes(filter.toLowerCase()));

            if (filteredProjects.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            filteredProjects.forEach(proj => {
                const targetUrl = `https://z3omohd.github.io/${proj.id}/`;

                const btn = document.createElement('a');
                btn.href = targetUrl;
                btn.target = '_blank';
                btn.className = 'glass-btn rounded-2xl p-3.5 flex flex-col items-center justify-center gap-2 group cursor-pointer border select-none';

                btn.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${proj.color} text-white flex items-center justify-center shadow-md transition-transform group-hover:scale-110">
                        <i data-lucide="${proj.icon}" class="w-5 h-5"></i>
                    </div>
                    <span class="font-medium text-xs text-slate-700 dark:text-slate-200 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors truncate w-full text-center">
                        ${proj.name}
                    </span>
                `;

                grid.appendChild(btn);
            });

            lucide.createIcons();
        }

        // Search Filter Event
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderButtons(e.target.value);
        });

        // Initial Load
        window.onload = () => {
            renderButtons();
        };
    </script>
</body>
</html>
